name: CEO desk validation
on:
  push:
    branches: [ceo-live-desk-20260922]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ceo-desk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AI_OS_AI_ENABLED: 'false'
      AI_OS_AUTONOMY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: State, privacy and telemetry tests
        run: |
          npx tsc app/lib/business-os/desk-state.ts --target ES2021 --module commonjs --outDir /tmp/da-desk-test --skipLibCheck
          node tests/ceo-desk.test.cjs /tmp/da-desk-test/desk-state.js
          node tests/ceo-route.test.cjs
          node tests/ceo-telemetry.test.cjs
          node scripts/test-owner-operations.mjs
          node scripts/test-whop-connection.mjs
      - name: Full application type check
        run: npx tsc --noEmit
      - name: Build without production secrets or paid AI
        run: npm run build
