name: Visual HQ validation
on:
  push:
    branches: [feat/visual-hq-20260924]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-hq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tracked source for isolated validation
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: visual-hq-source
          path: source.tar.gz
          retention-days: 1
