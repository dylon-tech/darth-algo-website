name: Autonomous agent health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the server worker independently of Vercel scheduling
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 10 https://www.darthalgo.com/api/health/agents
