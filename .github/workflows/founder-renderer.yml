name: Native media renderer validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/founder-renderer/**'
      - '.github/workflows/founder-renderer.yml'
  pull_request:
    paths:
      - 'scripts/founder-renderer/**'
      - '.github/workflows/founder-renderer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: founder-renderer-validation
  cancel-in-progress: true
jobs:
  render:
    if: github.repository == 'dylon-tech/darth-algo-website' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && github.event.repository.private == false
    # Standard public-repository compute is free. Never substitute a larger runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DARTH_RENDER_MODEL_DIR: /tmp/darth-render-models
      PYTHONUNBUFFERED: '1'
      ONNX_PROVIDER: CPUExecutionProvider
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --no-cache-dir -r scripts/founder-renderer/requirements.txt
          command -v ffmpeg
          command -v ffprobe
      - name: Verify free local narration weights
        run: python scripts/founder-renderer/setup_models.py
      - name: Validate the software with public approved source fixtures
        run: python scripts/founder-renderer/render.py --preflight --output "${{ runner.temp }}/renderer-validation"
      # No artifact upload, job-payload logs or persistent cache. Generated bytes
      # are test fixtures. Actions is never an application worker.
