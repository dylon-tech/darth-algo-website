<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Darth Algo Bull Bear Logo</title>
  <desc id="desc">Neon red Darth Algo logo with bull and bear heads, candlesticks, and a rising market arrow.</desc>
  <defs>
    <radialGradient id="logoBg" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#14161a"/>
      <stop offset="62%" stop-color="#040506"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="neonRed" x1="220" x2="1260" y1="690" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#670707"/>
      <stop offset="31%" stop-color="#ff1717"/>
      <stop offset="55%" stop-color="#ff756b"/>
      <stop offset="76%" stop-color="#d30000"/>
      <stop offset="100%" stop-color="#5b0505"/>
    </linearGradient>
    <linearGradient id="darkSteel" x1="260" x2="760" y1="90" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="23%" stop-color="#9ca1aa"/>
      <stop offset="60%" stop-color="#262932"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
    <linearGradient id="darthText" x1="0" x2="0" y1="520" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8177"/>
      <stop offset="28%" stop-color="#ff1a1a"/>
      <stop offset="65%" stop-color="#a80808"/>
      <stop offset="100%" stop-color="#420404"/>
    </linearGradient>
    <linearGradient id="algoText" x1="0" x2="0" y1="715" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#b8bdc5"/>
      <stop offset="72%" stop-color="#4c5058"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff1a1a" flood-opacity=".88"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#b90000" flood-opacity=".46"/>
    </filter>
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity=".9"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="transparent"/>
  <ellipse cx="800" cy="330" rx="482" ry="292" fill="url(#logoBg)" opacity=".98"/>
  <path d="M326 508a420 420 0 0 1 793-280" fill="none" stroke="url(#neonRed)" stroke-width="16" stroke-linecap="round" filter="url(#redGlow)"/>
  <path d="M389 185a386 386 0 0 1 650-26" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <path d="M1000 150c-52 92-104 191-148 302" fill="none" stroke="#ff1a1a" stroke-width="2" opacity=".35"/>

