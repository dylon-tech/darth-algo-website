    <path d="M1058 212c124-90 263-22 319 116-79-45-151-45-214-1-49 34-80 86-93 150-64-54-88-133-12-265Z" fill="#09090a"/>
    <path d="M1088 187c106 18 200 92 247 200-61-62-141-87-228-61-58 17-91 59-114 104 5-73 31-140 95-243Z" fill="#1a0909" stroke="#ff1a1a" stroke-width="5" filter="url(#redGlow)" opacity=".9"/>
  </g>

  <path d="M193 585c178-146 371-205 602-150" fill="none" stroke="url(#neonRed)" stroke-width="17" stroke-linecap="round" filter="url(#redGlow)"/>
  <path d="M632 500 1116 54l-22 104 88-20-292 302 26-105-252 230Z" fill="url(#neonRed)" stroke="#ff9b94" stroke-width="5" filter="url(#redGlow)"/>

  <g filter="url(#redGlow)">
    <path d="M319 376c42-24 81-17 113 17-42 8-80 4-113-17Z" fill="#ff1a1a"/>
    <path d="M1212 352c40-25 77-14 105 20-38 8-73 2-105-20Z" fill="#ff1a1a"/>
