    <rect x="542" y="250" width="36" height="84" fill="#9a0c0c" stroke="#ff655d" stroke-width="3"/>
    <line x1="620" x2="620" y1="97" y2="405" stroke="#ff1a1a" stroke-width="3"/>
    <rect x="602" y="205" width="36" height="116" fill="#d91414" stroke="#ff655d" stroke-width="3"/>
    <line x1="682" x2="682" y1="146" y2="390" stroke="#ff1a1a" stroke-width="3"/>
    <rect x="664" y="226" width="36" height="92" fill="#7d0909" stroke="#ff655d" stroke-width="3"/>
